    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; overflow-x: hidden; scroll-behavior: smooth; }
        #navigation-bar { position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; display: flex; align-items: center; justify-content: space-between; }
        #page-content { margin-top: 65px; min-height: calc(100vh - 65px); width: 100%; }
        .flex-container { display: flex; }
        .flex-row { flex-direction: row; align-items: center; }
        .flex-row-reverse { flex-direction: row-reverse; align-items: center; }
        .flex-column { flex-direction: column; }
        .flex-column-reverse { flex-direction: column-reverse; }
        .justify-center { justify-content: center; text-align: center; margin: 0 auto; }
        .filter-menu-item { cursor: pointer; padding: 10px 15px; margin-bottom: 5px; font-weight: bold; border-radius: 4px; transition: 0.3s; }
        .filter-menu-item:hover, .filter-menu-item.active { background-color: #e0e0e0; }
        .product-card { cursor: pointer; transition: transform 0.3s; }
        .product-card:hover { transform: translateY(-5px); }
        .modal-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:2000; justify-content:center; align-items:center; }
        .modal-content { background:#fff; padding:20px; border-radius:8px; max-width:800px; width:90%; max-height:90vh; overflow-y:auto; position:relative; }
        .close-btn { position:absolute; top:10px; right:15px; font-size:24px; cursor:pointer; font-weight:bold; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; }
        button { cursor: pointer; border: none; padding: 10px 20px; font-weight: bold; border-radius: 4px; }
    </style>
</head>

    <script>
        var DB = JSON.parse(document.getElementById('site-data').textContent);
        var WEB_APP_URL = "YOUR_WEB_APP_URL_HERE";

        // 🌟 防弹级图片解析器：彻底告别正则错误，采用 2024 最新免拦截直链
        function parseMediaUrl(url) {
            if (!url || url === "No Data") return "";
            if (url.toLowerCase() === "x") return "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><rect width='200' height='200' fill='%23eee'/></svg>";
            if (url.indexOf("drive.google.com") > -1) {
                try {
                    // 最稳妥的字符串切割法，绝不报错
                    var id = url.split("/d/")[1].split("/")[0];
                    return "https://lh3.googleusercontent.com/d/" + id;
                } catch(e) { return url; }
            }
            return url;
        }

        function getStyleRule(sectionName) {
            var exact = DB.Global.find(function(s) { return s.Section === sectionName; });
            if (exact) return exact;
            var parentName = sectionName;
            if (sectionName.indexOf(" Item") > -1) parentName = sectionName.replace(" Item", "");
            else if (sectionName.match(/ Row( \d+)?$/)) {
                parentName = sectionName.replace(/ Row( \d+)?$/, " Row");
                var parent = DB.Global.find(function(s) { return s.Section === parentName; });
                if (!parent) parentName = parentName.replace(" Row", "");
            }
            return DB.Global.find(function(s) { return s.Section === parentName; }) || { Section: sectionName };
        }

        function getFallbackHP(prop, selfRule, parentRule) {
            var hpVal = selfRule['HP ' + prop];
            if (!hpVal || hpVal === "No Data") {
                if (parentRule && parentRule['HP ' + prop] && parentRule['HP ' + prop] !== "No Data") return parentRule['HP ' + prop];
                return selfRule['PC ' + prop];
            }
            return hpVal;
        }

        function compileDynamicCSS() {
            var styleTag = document.createElement('style');
            var cssContent = "";
            DB.Global.forEach(function(rule, idx) {
                var cls = "dyn-style-" + idx;
                rule._compiledClass = cls; 
                var bgCss = "";
                var bg = rule['Bg Color/Pic'];
                if (bg && bg !== "No Data") {
                    if (bg.indexOf('http') === 0 || bg.indexOf('data:') === 0) bgCss = "background-image: url('" + parseMediaUrl(bg) + "'); background-size: cover; background-position: center;";
                    else bgCss = "background-color: " + bg + ";";
                }
                cssContent += "." + cls + " { " + bgCss;
                if (rule['PC Width'] && rule['PC Width'] !== "No Data") cssContent += "width:" + rule['PC Width'] + "; ";
                if (rule['PC Height'] && rule['PC Height'] !== "No Data") cssContent += "height:" + rule['PC Height'] + "; ";
                if (rule['PC Padding'] && rule['PC Padding'] !== "No Data") cssContent += "padding:" + rule['PC Padding'] + "; ";
                if (rule['PC Margin'] && rule['PC Margin'] !== "No Data") cssContent += "margin:" + rule['PC Margin'] + "; ";
                if (rule['Border Radius'] && rule['Border Radius'] !== "No Data") cssContent += "border-radius:" + rule['Border Radius'] + "; ";
                if (rule['Text Color'] && rule['Text Color'] !== "No Data") cssContent += "color:" + rule['Text Color'] + "; ";
                if (rule['PC Font Size'] && rule['PC Font Size'] !== "No Data") cssContent += "font-size:" + rule['PC Font Size'] + "px; ";
                if (rule['Font Weight'] && rule['Font Weight'] !== "No Data") cssContent += "font-weight:" + rule['Font Weight'].toLowerCase() + "; ";
                cssContent += "} ";

                var parentName = rule.Section.replace(" Item", "").replace(/ Row( \d+)?$/, "");
                var parentRule = DB.Global.find(function(s) { return s.Section === parentName; });
                var hpWidth = getFallbackHP('Width', rule, parentRule), hpHeight = getFallbackHP('Height', rule, parentRule);
                var hpPadding = getFallbackHP('Padding', rule, parentRule), hpMargin = getFallbackHP('Margin', rule, parentRule);
                var hpFontSize = getFallbackHP('Font Size', rule, parentRule), hpAlign = getFallbackHP('Alignment', rule, parentRule);

                cssContent += "@media (max-width: 768px) { ." + cls + " { ";
                if (hpWidth && hpWidth !== "No Data") cssContent += "width:" + hpWidth + " !important; ";
                if (hpHeight && hpHeight !== "No Data") cssContent += "height:" + hpHeight + " !important; ";
                if (hpPadding && hpPadding !== "No Data") cssContent += "padding:" + hpPadding + " !important; ";
                if (hpMargin && hpMargin !== "No Data") cssContent += "margin:" + hpMargin + " !important; ";
                if (hpFontSize && hpFontSize !== "No Data") cssContent += "font-size:" + hpFontSize + "px !important; ";
                if (hpAlign && hpAlign.indexOf('flex-column') > -1) cssContent += "flex-direction:column !important; ";
                if (hpAlign && hpAlign.indexOf('flex-reverse') > -1) cssContent += "flex-direction:column-reverse !important; ";
                cssContent += "} } ";
            });
            styleTag.innerHTML = cssContent;
            document.head.appendChild(styleTag);
        }

        function getLayoutClasses(rule) {
            var classes = [rule._compiledClass, "flex-container"];
            var align = rule['PC Alignment'] || "";
            var isCol = align.indexOf("flex-column") > -1, isRev = align.indexOf("flex-reverse") > -1 || align.indexOf("right") > -1;
            if (isCol && isRev) classes.push("flex-column-reverse");
            else if (isCol) classes.push("flex-column");
            else if (isRev) classes.push("flex-row-reverse");
            else classes.push("flex-row");
            if (rule['Layout Position'] === "center" || align.indexOf("center") > -1) classes.push("justify-center");
            return classes.join(" ");
        }

        function renderInnerSection(row) {
            if (row.Section === "Hero" || row.Section === "Header") {
                if (row.Media !== "No Data") return '<img src="' + parseMediaUrl(row.Media) + '" style="width:100%; height:100%; object-fit:cover;">';
                return "";
            }
            var textBlock = '';
            if (row.Title !== "No Data" || row.Content !== "No Data") {
                textBlock = '<div style="flex:1; padding:20px; min-width:300px;"><h2 style="margin-bottom:15px;">' + (row.Title !== "No Data" ? row.Title : "") + '</h2><p style="line-height:1.6; white-space:pre-wrap;">' + (row.Content !== "No Data" ? row.Content : "") + '</p></div>';
            }
            var mediaBlock = '';
            if (row.Media !== "No Data") {
                mediaBlock = '<div style="flex:1; display:flex; justify-content:center; padding:20px; min-width:300px;"><img src="' + parseMediaUrl(row.Media) + '" style="max-width:100%; border-radius:8px;"></div>';
            }
            return textBlock + mediaBlock;
        }

        // 🌟 智能路由引擎：模糊匹配你写的任意 Link 名字
        function renderPage() {
            var hash = window.location.hash.substring(1).toLowerCase() || "main";
            var contentDiv = document.getElementById("page-content");
            contentDiv.innerHTML = ""; 

            if (hash === "" || hash.indexOf("main") > -1 || hash.indexOf("index") > -1) {
                document.title = "主页";
                
                // 🌟 智能包裹器：把 About Row 打包进 About 盒子里
                var currentGroup = null;
                var groups = [];
                DB.Main.forEach(function(row) {
                    if (row.Section.indexOf(' Row') > -1) {
                        var baseName = row.Section.split(' Row')[0];
                        if (!currentGroup || currentGroup.name !== baseName) {
                            currentGroup = { name: baseName, isWrapper: true, rows: [] };
                            groups.push(currentGroup);
                        }
                        currentGroup.rows.push(row);
                    } else {
                        currentGroup = null;
                        groups.push({ name: row.Section, isWrapper: false, row: row });
                    }
                });

                groups.forEach(function(g) {
                    if (g.isWrapper) {
                        var pRules = getStyleRule(g.name);
                        var html = '<div class="' + getLayoutClasses(pRules) + '">';
                        g.rows.forEach(function(r) {
                            html += '<div class="' + getLayoutClasses(getStyleRule(r.Section)) + '">' + renderInnerSection(r) + '</div>';
                        });
                        html += '</div>';
                        contentDiv.innerHTML += html;
                    } else {
                        contentDiv.innerHTML += '<div class="' + getLayoutClasses(getStyleRule(g.name)) + '">' + renderInnerSection(g.row) + '</div>';
                    }
                });
                
            } else if (hash.indexOf("product") > -1) {
                document.title = "产品展示";
                var wrapRules = getStyleRule("Product Filter Container");
                var html = '<div class="' + getLayoutClasses(wrapRules) + ' align-items-start">';
                var menuRules = getStyleRule("Product Filter Menu");
                var menuHtml = '<div class="' + menuRules._compiledClass + ' flex-column" style="min-width:200px;">';
                var menus = DB.Product.filter(function(r) { return r.Section === "Product Filter Menu Item"; });
                menus.forEach(function(m, i) {
                    var mRule = getStyleRule(m.Section);
                    var activeCls = i === 0 ? "active" : "";
                    menuHtml += '<div class="filter-menu-item ' + mRule._compiledClass + ' ' + activeCls + '" onclick="filterProducts(this, \'' + m.Title + '\')">' + m.Title + '</div>';
                });
                menuHtml += '</div>';

                var gridRules = getStyleRule("Product Grid");
                var gridHtml = '<div class="' + gridRules._compiledClass + ' flex-container flex-row" style="flex-wrap:wrap; flex:1; padding:20px;" id="product-grid">';
                DB.Product.filter(function(r) { return r.Section === "Product Filter Content Item"; }).forEach(function(item) {
                    var iRule = getStyleRule(item.Section);
                    gridHtml += '<div class="product-card ' + iRule._compiledClass + ' flex-column justify-center" data-category="' + item['Category / Tag'] + '" onclick="openModal(\'' + item['Product ID'] + '\')">' +
                                '<img src="' + parseMediaUrl(item.Media) + '" style="width:100%; height:200px; object-fit:cover; border-radius:8px;">' +
                                '<h3 style="margin-top:10px;">' + item.Title + '</h3>' +
                                '<p style="color:#666; font-size:14px;">' + (item.Content !== "No Data" ? item.Content : "") + '</p></div>';
                });
                gridHtml += '</div>';
                contentDiv.innerHTML = html + menuHtml + gridHtml + '</div>';
                if(menus.length > 0) filterProducts(document.querySelector('.filter-menu-item'), menus[0].Title);

            } else if (hash.indexOf("contact") > -1) {
                document.title = "联系我们";
                var cRules = getStyleRule("Contact Container");
                var cHtml = '<div class="' + getLayoutClasses(cRules) + '">';
                DB.Contact.forEach(function(row) {
                    var rRules = getStyleRule(row.Section);
                    if (row.Section === "Feedback Form") {
                        if (row.Button === "Submit") cHtml += '<button onclick="submitForm()" class="' + rRules._compiledClass + '">提交留言</button>';
                        else if (row.Media !== "No Data") cHtml += '<div class="' + rRules._compiledClass + ' flex-column" style="margin-bottom:10px;"><label style="font-weight:bold; margin-bottom:5px;">' + row.Title + '</label>' + (row.Media === 'textarea' ? '<textarea id="' + row.Title + '" placeholder="' + row.Content + '" rows="4"></textarea>' : '<input type="' + row.Media + '" id="' + row.Title + '" placeholder="' + row.Content + '">') + '</div>';
                    } else if (row.Section === "Contact Item") {
                        cHtml += '<div class="flex-container flex-row ' + rRules._compiledClass + '" style="margin-bottom:10px;"><div style="width:120px; font-weight:bold;">' + row.Title + ' :</div><div>' + (row.Content !== "No Data" ? row.Content : "") + '</div></div>';
                    } else cHtml += '<h1 class="' + rRules._compiledClass + '" style="margin-bottom:20px;">' + row.Title + '</h1>';
                });
                contentDiv.innerHTML = cHtml + '</div>';
            }
        }

        function filterProducts(elem, category) {
            document.querySelectorAll('.filter-menu-item').forEach(function(el) { el.classList.remove('active'); });
            elem.classList.add('active');
            document.querySelectorAll('.product-card').forEach(function(card) {
                if (category === "全部" || category === "All" || card.getAttribute('data-category') === category) card.style.display = "flex";
                else card.style.display = "none";
            });
        }

        function openModal(productId) {
            if (!productId || productId === "No Data") return;
            var relatedItems = DB.Product.filter(function(r) { return r['Product ID'] === productId; });
            if (relatedItems.length === 0) return;
            var bodyHtml = '<h2 style="margin-bottom:20px; border-bottom:2px solid #eee; padding-bottom:10px;">' + relatedItems[0].Title + '</h2><div class="flex-container flex-row" style="flex-wrap:wrap; gap:15px;">';
            relatedItems.forEach(function(item) {
                bodyHtml += '<div style="flex:1; min-width:250px;">';
                if(item.Media !== "No Data") bodyHtml += '<img src="' + parseMediaUrl(item.Media) + '" style="width:100%; border-radius:8px;">';
                if(item.Content !== "No Data") bodyHtml += '<p style="margin-top:10px; color:#555;">' + item.Content + '</p>';
                bodyHtml += '</div>';
            });
            bodyHtml += '</div>';
            document.getElementById('modal-body').innerHTML = bodyHtml;
            document.getElementById('product-modal').style.display = 'flex';
        }

        function closeModal(e) {
            if (e.target.id === 'product-modal' || e.target.className === 'close-btn') document.getElementById('product-modal').style.display = 'none';
        }

        function submitForm() {
            var payload = { Name: document.getElementById("Name") ? document.getElementById("Name").value : "", Email: document.getElementById("Email") ? document.getElementById("Email").value : "", Description: document.getElementById("Description") ? document.getElementById("Description").value : "" };
            fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(payload) }).then(function(res) { return res.json(); }).then(function(data) {
                if (data.status === 'success') { alert("提交成功！"); location.reload(); } else alert("提交异常，请稍后再试。");
            }).catch(function(e) { console.error(e); });
        }

        function initNavigation() {
            var navDiv = document.getElementById("navigation-bar");
            var nRules = getStyleRule("Navigation");
            navDiv.className = nRules._compiledClass + " flex-container flex-row";
            var leftMenu = '<div class="flex-row">', rightMenu = '<div class="flex-row">';
            DB.Navigation.forEach(function(row) {
                var rRule = getStyleRule(row.Section);
                var link = '<a href="#' + row.Link + '" class="' + rRule._compiledClass + '" style="text-decoration:none;">' + row.Title + '</a>';
                if (row.Section === "Navigation Item") leftMenu += link;
                if (row.Section === "Navigation Right") rightMenu += link;
            });
            navDiv.innerHTML = leftMenu + "</div>" + rightMenu + "</div>";
        }

        window.addEventListener('hashchange', function() { window.scrollTo(0, 0); renderPage(); });
        window.onload = function() { compileDynamicCSS(); initNavigation(); renderPage(); };
    </script>
</body>
</html>
