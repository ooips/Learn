r X, the engine must \nautomatically generate a clean, light-gray SVG placeholder image.","Chinese Specification (中文规则对照)":"任何媒体链接栏位如果填入单个字母 x，引擎必须自动生成\n一张浅灰色的 SVG 占位图，确保网页排版不塌陷。"},{"Module (模块)":"Google Drive CDN Bypass\n\n(突破网盘拦截)","Condition (触发条件)":"All media link columns","English Specification (英文规则描述)":"All drive.google.com links must be automatically restructured into Google's \nofficial lh3/googleusercontent CDN stream channel to bypass 403 blocks.","Chinese Specification (中文规则对照)":"所有谷歌云端硬盘链接，系统必须在后台自动重组为谷歌官方\n的 lh3 直链通道，彻底绕过浏览器的 403 跨域拦截。"},{"Module (模块)":"Cascading Style Inheritance\n\n(样式继承)","Condition (触发条件)":"About Row* in Main sheet","English Specification (英文规则描述)":"If any section starting with About Row (e.g., About Row1) lacks an exact match \nin Global, it must strip trailing numbers and inherit About Row styles.","Chinese Specification (中文规则对照)":"以 About Row 开头的 Section（如 Row1），在 Global 里若\n找不到全名，则自动剥离末尾数字，强制继承 About Row 的\n全局样式。"},{"Module (模块)":"Alternating Split Layout\n\n(图文交错)","Condition (触发条件)":"About Row* in Main sheet","English Specification (英文规则描述)":"The engine enforces Layout B: Title and Content must be wrapped into a vertical \ntext-group container first, then aligned horizontally next to the Media.","Chinese Specification (中文规则对照)":"网页必须采用场景B（图文左右排）：Title 和 Content 必须先打\n包进一个垂直的隐形文案盒，整体再与 Media 图片左右并排。"},{"Module (模块)":"Product Gallery Overview\n\n(产品画廊列表页)","Condition (触发条件)":"Default Picture & Title","English Specification (英文规则描述)":"The main gallery page (products.html) must only display the Title and Default \nPicture (as thumbnail). It must never load the heavy Media or Content.","Chinese Specification (中文规则对照)":"产品主列表页（画廊区）的每张卡片只能展示 Title 和 Default \nPicture（封面图）。为了极速加载，绝对不能在此页面渲染 \nMedia 和 Content。"},{"Module (模块)":"Product Detail Page Assets\n\n(产品详情页内容)","Condition (触发条件)":"Content & Media in Product sheet","English Specification (英文规则描述)":"The Content and Media columns belong exclusively to the Product ID detail \npop-up. The engine must render them only inside the pop-up modal.","Chinese Specification (中文规则对照)":"Content（详述）和 Media（多媒体）是小分页详情弹\n窗的专属资产。引擎只有在用户点击卡片触发弹窗时，\n才允许把它们渲染在弹窗内部。"},{"Module (模块)":"Product Data Consolidation\n\n(商品多行合并)","Condition (触发条件)":"Product ID multi-rows","English Specification (英文规则描述)":"If rows share the same Product ID, the gallery renders one card. However, it \ncombines all Media links across those rows into a slideshow array for the pop-up.","Chinese Specification (中文规则对照)":"如果多行数据拥有完全相同的 Product ID，画廊页只生成一\n张卡片，但详情弹窗会把这几行所有的 Media 链接打包成一\n个幻灯片轮播图数组。"},{"Module (模块)":"Dynamic Filtering\n\n(无刷新筛选)","Condition (触发条件)":"Section names containing Menu","English Specification (英文规则描述)":"Rows with Menu in the Section name must form a 30%-width sticky left sidebar. \nClicking buttons must instantly toggle right-side cards based on Category/Tag.","Chinese Specification (中文规则对照)":"Section 名字包含 Menu 的所有行自动组合成左侧 30% 宽度\n的固定菜单栏。点击分类按钮，右侧卡片根据 Category/Tag \n标签实现瞬间显示/隐身。"},{"Module (模块)":"Product Detail Pop-up\n\n(详情局部弹窗)","Condition (触发条件)":"Clicking valid product cards","English Specification (英文规则描述)":"Clicking a card with a valid Product ID (excluding \"-\") must trigger a custom \nmodal overlay styled according to the Product ID specs in the Global sheet.","Chinese Specification (中文规则对照)":"当用户点击带有真实 Product ID 的商品卡片时，在当前页直\n接弹出一个局部覆盖的高定详情弹窗，其样式完全套用 Global \n中 Product ID 的设定。"},{"Module (模块)":"Carousel State Control\n\n(智能视频轮播联动)","Condition (触发条件)":"Multimedia slider in pop-up","English Specification (英文规则描述)":"The carousel must pause instantly when a video plays. When the video ends, the \nsystem must wait for 3 seconds before automatically resuming the carousel \nrotation.","Chinese Specification (中文规则对照)":"详情页轮播图如果播放到视频，用户点击播放时轮播必须立刻\n暂停；视频播放结束（On Ended）后，强制等待 3 秒钟，随\n后自动恢复轮播。"},{"Module (模块)":"Single-Page Hash Routing\n\n(刷新定位路由)","Condition (触发条件)":"All page navigations","English Specification (英文规则描述)":"The site operates as an SPA via Hash Routing (#index.html). On manual browser \nrefresh, the system must remain on the current hash page instead of resetting to \nhome.","Chinese Specification (中文规则对照)":"整个网站采用单页哈希路由（如 #products.html）。当用户手\n动点击浏览器刷新时，系统必须精确锁死当前页面，绝对不能\n重置跳回首页。"},{"Module (模块)":"Persistent Navigation\n\n(导航栏常驻机制)","Condition (触发条件)":"Navigation sheet data","English Specification (英文规则描述)":"The Navigation bar must be rendered as a globally persistent component at the \nabsolute top of the viewport. During page switches, only the #page-content area \nshall be updated; the navigation bar must never be re-rendered or destroyed.","Chinese Specification (中文规则对照)":"导航栏必须作为全局常驻组件渲染在视口最顶部。在切换页面\n时，系统只允许刷新内容区，绝对不能重新渲染或销毁导航栏，\n避免画面闪烁。"},{"Module (模块)":"GitHub Deployment\n\n(GitHub 自动化部署)","Condition (触发条件)":"buildMyWebsite execution","English Specification (英文规则描述)":"The engine must not use standard Google Web App deployment (doGet). Instead, \nit must utilize the GitHub API (PUT method) to compile and push the finalized \npure static index.html directly to the specified GitHub repository.","Chinese Specification (中文规则对照)":"整个系统不使用谷歌自带的 Web App 部署。当点击运行时，\n必须通过 GitHub API 将编译好的纯静态 index.html 源码直接推\n送到指定的 GitHub 仓库中。"},{"Module (模块)":"Dynamic Tab Titles\n\n(动态浏览器标题)","Condition (触发条件)":"Dynamic page switching","English Specification (英文规则描述)":"The browser tab title (\u003ctitle> tag) must change dynamically based on the active \npage. (e.g., Show \"Home\" for index.html, \"Products\" for products.html, and \n\"Contact Us\" for contact.html).","Chinese Specification (中文规则对照)":"浏览器的标签页标题必须随着页面切换而动态改变。（例如：\n首页显示“首页”，产品页显示“产品中心”，联系我们页显示\n“联系我们”）。"},{"Module (模块)":"Custom logic override\n\n(动态逻辑兜底)","Condition (触发条件)":"Non-style logic issues","English Specification (英文规则描述)":"Any behavioral, data-processing, or interactive logic requirements that cannot \nbe defined via CSS properties in the Global sheet must be declared here to guide \nApps Script core engine development.","Chinese Specification (中文规则对照)":"任何无法通过 Global 表中的 CSS 样式属性解决的交互、数据\n处理或底层逻辑需求，必须统一在此表声明，用以指导 \nApps Script 核心引擎的代码编写。"},{"Module (模块)":"Form Element Mapping\n\n(表单元素变身映射)","Condition (触发条件)":"Feedback Form","English Specification (英文规则描述)":"If Button is empty and Media is \"-\" (or empty), render it as a static header text \nblock (\u003ch1> and \u003cp>) at the top of the form. If Media contains an input type \n(e.g., text, email), map it to an HTML \u003cinput> or \u003ctextarea> where Title is the label \nand Content is the placeholder.","Chinese Specification (中文规则对照)":"当遇到名为 Feedback Form 的 Section 时：如果 Button 为空\n且 Media 填的是 \"-\"（或留空），必须将其渲染为表单顶部的静\n态大标题与副标题文本块；如果 Media 填的是具体的输入类型\n（如 text），才将其转化为打字输入框组件。"},{"Module (模块)":"Form Submission\n\n(表单提交响应)","Condition (触发条件)":"Feedback Form","English Specification (英文规则描述)":"When the Submit button is clicked, the engine must intercept the event, collect all \ninput values, and send a POST request to the Apps Script API. The data must be \nautomatically appended as a new row in a spreadsheet tab named Feedback.","Chinese Specification (中文规则对照)":"当用户点击提交按钮时，前端引擎必须拦截该事件，自动收集所\n有输入框的内容，并通过 POST 请求异步发送给 Apps Script 后\n端 API。数据需自动追加到名为 Feedback 的新表格行中。"},{"Module (模块)":"Item Style Inheritance\n\n(子元素样式智能继承)","Condition (触发条件)":"Any Section name ending with Item","English Specification (英文规则描述)":"If a section name from the data sheet ends with \"Item\" (e.g., Product Filter Menu \nItem) and lacks an exact match in Global, the engine must automatically strip the \n\"Item\" suffix and force it to inherit the base styles of its parent container (e.g., \nProduct Filter Menu).","Chinese Specification (中文规则对照)":"当数据表中的 Section 名字以 \"Item\" 结尾（如 Product Filter \nMenu Item），且在 Global 表中找不到一字不差的完美匹配时，\n核心引擎必须自动剥离末尾的 \"Item\" 单词，让其强制继承父级大\n盒子（如 Product Filter Menu）的全局样式。"}]}
    </script>

    <script>
        // === 1. 挂载 Google Sheets 数据 ===
        const DB = JSON.parse(document.getElementById('site-data').textContent);
        const WEB_APP_URL = "YOUR_WEB_APP_URL_HERE";

        // === 2. 突破网盘拦截 (修复后) ===
        function parseMediaUrl(url) {
            if (!url || url === "No Data") return "";
            if (url.toLowerCase() === "x") return "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><rect width='200' height='200' fill='%23eee'/></svg>";
            if (url.includes("drive.google.com")) {
                const match = url.match(/\/d\/(.+?)\//);
                if (match && match[1]) return `https://lh3.googleusercontent.com/d/$/$${match[1]}`; // 这里修复了模板字符串语法
            }
            return url;
        }

        // === 3. 样式继承处理器 ===
        function getStyleRules(sectionName) {
            let styleObj = DB.Global.find(s => s.Section === sectionName);
            if (!styleObj && sectionName.endsWith(" Item")) {
                let parentName = sectionName.replace(" Item", "");
                styleObj = DB.Global.find(s => s.Section === parentName);
            }
            return styleObj || {};
        }

        // === 4. 生成行内 CSS 样式 (🌟 修复了背景图片逻辑) ===
        function generateInlineCSS(rules) {
            if (!rules) return "";
            let css = "";
            if (rules['PC Width'] && rules['PC Width'] !== "No Data") css += `width: ${rules['PC Width']};`;
            if (rules['PC Height'] && rules['PC Height'] !== "No Data") css += `height: ${rules['PC Height']};`;
            if (rules['PC Padding'] && rules['PC Padding'] !== "No Data") css += `padding: ${rules['PC Padding']};`;
            if (rules['Border Radius'] && rules['Border Radius'] !== "No Data") css += `border-radius: ${rules['Border Radius']};`;
            if (rules['Text Color'] && rules['Text Color'] !== "No Data") css += `color: ${rules['Text Color']};`;
            
            // 智能判断是颜色还是背景图
            if (rules['Bg Color/Pic'] && rules['Bg Color/Pic'] !== "No Data") {
                let bg = rules['Bg Color/Pic'];
                if (bg.startsWith("http") || bg.startsWith("data:")) {
                    css += `background-image: url('${parseMediaUrl(bg)}'); background-size: cover; background-position: center;`;
                } else {
                    css += `background-color: ${bg};`;
                }
            }
            return css;
        }

        // === 5. 哈希路由引擎 (🌟 补全了产品页逻辑) ===
        function renderPage() {
            // 解析导航栏中的 Link (例如 products.html)，容错处理空哈希
            let hash = window.location.hash.substring(1) || "index.html";
            let contentDiv = document.getElementById("page-content");
            contentDiv.innerHTML = ""; 

            // ---------------- 首页渲染 ----------------
            if (hash === "index.html") {
                document.title = "首页";
                DB.Main.forEach(row => {
                    let rules = getStyleRules(row.Section);
                    let classNames = rules['PC Alignment'] === "flex-column" ? "flex-column" : "flex-row";
                    if (rules['Layout Position'] === "center") classNames += " center-layout";
                    
                    contentDiv.innerHTML += `<div style="${generateInlineCSS(rules)}" class="${classNames}">
                        ${row.Title !== "No Data" ? `<h2>${row.Title}</h2>` : ""}
                        ${row.Content !== "No Data" ? `<p>${row.Content}</p>` : ""}
                        ${row.Media !== "No Data" ? `<img src="${parseMediaUrl(row.Media)}" style="max-width:100%; border-radius:8px; margin-top:10px;">` : ""}
                    </div>`;
                });
            } 
            // ---------------- 产品中心渲染 ----------------
            else if (hash === "products.html") {
                document.title = "产品中心";
                // 开启图文交错的父容器：左边30%菜单，右边70%卡片
                let menuHTML = '<div class="flex-column" style="width: 30%; padding: 20px;">';
                let cardsHTML = '<div class="flex-row-wrap" style="width: 70%; padding: 20px; align-items: flex-start; align-content: flex-start;">';
                
                DB.Product.forEach(row => {
                    let rules = getStyleRules(row.Section);
                    
                    if (row.Section.includes("Menu Item")) {
                        // 左侧分类按钮
                        menuHTML += `<button style="${generateInlineCSS(rules)} margin-bottom: 15px; width: 100%; border:none;">${row.Title}</button>`;
                    } else if (row.Section.includes("Content Item")) {
                        // 右侧产品卡片（遵守 Config 宪法：仅展示标题和 Default Picture）
                        cardsHTML += `<div style="${generateInlineCSS(rules)} margin: 10px; padding: 15px; text-align: center; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                            <img src="${parseMediaUrl(row['Default Picture'])}" style="width:100%; max-height:200px; object-fit:cover; border-radius:8px;">
                            <h3 style="margin-top:15px; font-size:18px;">${row.Title !== "No Data" ? row.Title : ""}</h3>
                        </div>`;
                    }
                });
                
                menuHTML += '</div>';
                cardsHTML += '</div>';
                // 拼接左右两大金刚
                contentDiv.innerHTML = `<div class="flex-row" style="width: 100%; align-items: flex-start;">${menuHTML}${cardsHTML}</div>`;
            } 
            // ---------------- 联系我们渲染 ----------------
            else if (hash === "contact.html") {
                document.title = "联系我们";
                let contactHTML = '<div class="center-layout flex-column" style="width: 100%; align-items: center; padding-top: 50px;">';
                
                DB.Contact.forEach(row => {
                    let rules = getStyleRules(row.Section);
                    
                    if (row.Section === "Feedback Form") {
                        if (row.Button === "Submit") {
                            contactHTML += `<button onclick="submitForm()" style="background-color: #4285f4; color: white; width:100%; margin-top: 20px; padding: 12px; border-radius: 8px;">Submit</button>`;
                        } else if (row.Media !== "No Data") {
                            contactHTML += `
                                <div style="width: 100%; margin-bottom: 15px; text-align: left;">
                                    <label style="display:block; font-weight:bold; margin-bottom: 8px; color: #333;">${row.Title}</label>
                                    ${row.Media === 'textarea' ? 
                                        `<textarea id="${row.Title}" placeholder="${row.Content}" rows="5" style="border-radius: 8px; border: 1px solid #ddd;"></textarea>` : 
                                        `<input type="${row.Media}" id="${row.Title}" placeholder="${row.Content}" style="border-radius: 8px; border: 1px solid #ddd;">`}
                                </div>`;
                        }
                    } else if (row.Section === "Contact Item") {
                        contactHTML += `
                            <div class="flex-row" style="width: 100%; margin-bottom: 15px;">
                                <div style="width: 120px; text-align: left; font-weight: bold; color: #555;">${row.Title}</div>
                                <div style="color: #666;">${row.Content !== "No Data" ? row.Content : ""}</div>
                            </div>`;
                    } else {
                        contactHTML += `<h1 style="margin-bottom: 30px; color: #222;">${row.Title}</h1>`;
                    }
                });
                contactHTML += '</div>';
                
                // 将表单和联系信息包裹在一张居中的大卡片里
                contentDiv.innerHTML = `<div style="width: 50%; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin: 40px auto;">${contactHTML}</div>`;
            }
        }

        // === 6. 表单提交异步管道 ===
        function submitForm() {
            const payload = {
                Name: document.getElementById("Name") ? document.getElementById("Name").value : "",
                Email: document.getElementById("Email") ? document.getElementById("Email").value : "",
                Description: document.getElementById("Description") ? document.getElementById("Description").value : ""
            };

            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            }).then(res => res.json()).then(data => {
                if (data.status === 'success') {
                    alert("提交成功！我们会在 24 小时内回复您。");
                    location.reload();
                } else {
                    alert("提交异常，请稍后再试。");
                }
            }).catch(e => console.error(e));
        }

        // === 7. 渲染常驻导航栏 ===
        function initNavigation() {
            let navDiv = document.getElementById("navigation-bar");
            let navRules = getStyleRules("Navigation");
            navDiv.style = generateInlineCSS(navRules) + " justify-content: space-between;";

            let leftMenu = '<div class="flex-row">';
            let rightMenu = '<div class="flex-row">';

            DB.Navigation.forEach(row => {
                // 🌟 【防弹修复区】：强制把抓取到的东西变成字符串，如果是 undefined 就变成空字串 ""，绝对不让引擎崩溃！
                let linkTarget = (row.Link && row.Link !== "No Data") ? String(row.Link) : "";
                let href = linkTarget.endsWith(".html") ? "#" + linkTarget : linkTarget;
                
                // 同样给 Title 也加个防弹保护
                let titleText = (row.Title && row.Title !== "No Data") ? row.Title : "";
                
                let linkStr = `<a href="${href}" style="text-decoration:none; color: inherit; margin: 0 15px; font-weight:bold;">${row.Title}</a>`;
                
                if (row.Section === "Navigation Item") leftMenu += linkStr;
                if (row.Section === "Navigation Right") rightMenu += linkStr;
            });
            
            navDiv.innerHTML = leftMenu + "</div>" + rightMenu + "</div>";
        }

        window.addEventListener('hashchange', renderPage);
        window.onload = () => {
            initNavigation();
            renderPage(); 
        };
    </script>
</body>
</html>
