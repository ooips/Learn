<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Showcase SPA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #fafafa; } 
        .flex-container { display: flex; }
        .flex-row { display: flex; flex-direction: row; align-items: center; }
        .flex-column { display: flex; flex-direction: column; }
        .flex-row-wrap { display: flex; flex-direction: row; flex-wrap: wrap; }
        .flex-column-reverse { display: flex; flex-direction: column-reverse; }
        .flex-row-reverse { display: flex; flex-direction: row-reverse; align-items: center; }
        
        .seamless-container { display: flex; flex-direction: column; gap: 0 !important; width: 100%; }
        .seamless-container > * { margin: 0 !important; border-radius: 0 !important; box-shadow: none !important; }
        
        .filter-menu-item { padding: 12px 20px; cursor: pointer; transition: all 0.3s; border-radius: 6px; margin-bottom: 5px; font-weight: 500; }
        .filter-menu-item.active { background-color: #4285f4 !important; color: white !important; }
        .product-card { cursor: pointer; transition: transform 0.2s; background: white; border: 1px solid #eee; padding: 15px; border-radius: 8px; margin: 10px; width: calc(33.33% - 20px); box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        /* 🌟 弹窗组件样式 */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 10000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-content { background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 700px; max-height: 90vh; overflow-y: auto; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .modal-close { position: absolute; top: 15px; right: 20px; font-size: 28px; background: none; border: none; cursor: pointer; color: #555; }
    </style>
</head>
<body>

    <div id="navigation-bar"></div>
    <div id="page-content"></div>
    
    <div id="product-modal" class="modal-overlay" onclick="if(event.target===this) closeModal()">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div id="modal-body" class="flex-column" style="gap:15px; align-items:center; text-align:center;"></div>
        </div>
    </div>

    <script id="site-data" type="application/json">{"Config":[{"Module (模块)":"Defensive Type Casting\n(全局防御性数据强转)","Condition (触发条件)":"All data cells and data binding \noperations","English Specification (英文规则描述)":"The core engine must implement strict defensive type casting. Any cell value that \nevaluates to undefined or null must be automatically converted to an empty string \n\"\" before processing string methods (e.g., endsWith), preventing critical runtime type \nerrors.","Chinese Specification (中文规则对照)":"核心引擎必须实现严格的防御性类型转换。在调用任何字符串\n方法（如 endsWith）之前，任何判定为 undefined 或 null 的单元\n格数据，系统必须在底层自动强转为空字符串 \"\"，彻底杜绝运行\n时类型报错。"},{"Module (模块)":"Data Sanitization\n(数据清洗)","Condition (触发条件)":"All columns across all sheets","English Specification (英文规则描述)":"Any cell that is completely empty or filled with a hyphen (\"-\") must be treated as \n\"No Data\". The engine must completely skip these fields during rendering.","Chinese Specification (中文规则对照)":"任何完全留空或填入短横线 (\"-\") 的单元格，系统必须统一判\n定为**“无数据”**，在渲染网页时直接跳过，绝不显示。"},{"Module (模块)":"Product Data Consolidation\n(商品多行合并)","Condition (触发条件)":"Product ID multi-rows","English Specification (英文规则描述)":"If rows share the same Product ID, the gallery renders one card. However, it \ncombines all Media links across those rows into a slideshow array for the pop-up.","Chinese Specification (中文规则对照)":"如果多行数据拥有完全相同的 Product ID，画廊页只生成一\n张卡片，但详情弹窗会把这几行所有的 Media 链接打包成一\n个幻灯片轮播图数组。"},{"Module (模块)":"Media Stream Transformer","Condition (触发条件)":"All media link columns, image/video fields, and \nGoogle Drive URLs","English Specification (英文规则描述)":"The core engine implements parseMediaUrl(url): 1. Convert drive.google.com links \ninto verified official stream hosts via regex file ID extraction to bypass 403 blocks. \n2. If the media value is 'x', automatically generate a light-gray SVG placeholder to \npreserve layout","Chinese Specification (中文规则对照)":"核心引擎内置 parseMediaUrl(url)：1. 凡是包含 drive.google.com \n的链接，必须用正则抓取 33 位 ID 并重组为官方 lh3 CDN 直链绕\n过 403 拦截 ；2. 若遇到媒体字段填入单个字母 x，则自动生成轻\n量级灰色 SVG 占位图防塌陷 。"},{"Module (模块)":"SPA Hash Router Engine","Condition (触发条件)":"All page navigations, navigation link clicks, and \nURL hash changes","English Specification (英文规则描述)":"The entire site operates via Single-Page Hash Routing. Listen to the hashchange \nevent to instantly update the #page-content without reloading. Dynamically map \nhashes to their corresponding sheet names and strictly lock the current hash page \nupon browser manual refresh.","Chinese Specification (中文规则对照)":"整个系统由哈希路由驱动。监听 hashchange 事件，动态读取导\n航 Link 并无刷新映射渲染对应的同名工作表（无匹配则显示 40\n4) ；手动刷新浏览器时必须精确锁死当前哈希页面 。"},{"Module (模块)":"Persistent Navigation\n(导航栏常驻机制)","Condition (触发条件)":"Navigation sheet data","English Specification (英文规则描述)":"The Navigation bar must be rendered as a globally persistent component at the \nabsolute top of the viewport. During page switches, only the #page-content area \nshall be updated; the navigation bar must never be re-rendered or destroyed.","Chinese Specification (中文规则对照)":"导航栏必须作为全局常驻组件渲染在视口最顶部。在切换页面\n时，系统只允许刷新内容区，绝对不能重新渲染或销毁导航栏，\n避免画面闪烁。"},{"Module (模块)":"Dynamic Tab Titles\n(动态浏览器标题)","Condition (触发条件)":"Dynamic page switching","English Specification (英文规则描述)":"The browser tab title (\u003ctitle> tag) must change dynamically based on the active \npage.","Chinese Specification (中文规则对照)":"浏览器的标签页标题必须随着页面切换而动态改变。（例如：\n首页显示“首页”，产品页显示“产品中心”，联系我们页显示\n“联系我们”）。"},{"Module (模块)":"Global CSS Mapper\n(全局样式映射引擎)","Condition (触发条件)":"Parsing Global sheet columns","English Specification (英文规则描述)":"The engine must strictly map Global columns to CSS properties: Width/Height to \nwidth/height, Padding/Margin to padding/margin, Text Color to color, Font Size to \nfont-size (with px), and Border Radius to border-radius.","Chinese Specification (中文规则对照)":"引擎必须将 Global 表的参数严格转换为 CSS 属性：将 \nWidth/Height 映射为宽高，Padding/Margin 映射为内外边距，\nText Color 映射为字体颜色，Font Size 自动加上 px 单位，Border \nRadius 映射为圆角。"},{"Module (模块)":"Cascading Style Inheritance\n(样式继承)","Condition (触发条件)":"About Row* in Main sheet","English Specification (英文规则描述)":"If any section starting with About Row (e.g., About Row1) lacks an exact match \nin Global, it must strip trailing numbers and inherit About Row styles.","Chinese Specification (中文规则对照)":"以 About Row 开头的 Section（如 Row1），在 Global 里若\n找不到全名，则自动剥离末尾数字，强制继承 About Row 的\n全局样式。"},{"Module (模块)":"Item Style Inheritance\n(子元素样式智能继承)","Condition (触发条件)":"Any Section name ending with Item","English Specification (英文规则描述)":"If a section name from the data sheet ends with \"Item\" (e.g., Product Filter Menu \nItem) and lacks an exact match in Global, the engine must automatically strip the \n\"Item\" suffix and force it to inherit the base styles of its parent container (e.g., \nProduct Filter Menu).","Chinese Specification (中文规则对照)":"当数据表中的 Section 名字以 \"Item\" 结尾（如 Product Filter \nMenu Item），且在 Global 表中找不到一字不差的完美匹配时，\n核心引擎必须自动剥离末尾的 \"Item\" 单词，让其强制继承父级大\n盒子（如 Product Filter Menu）的全局样式。"},{"Module (模块)":"Intelligent Background Parser\n(背景样式智能判定)","Condition (触发条件)":"Bg Color/Pic column in Global sheet","English Specification (英文规则描述)":"The CSS compiler must dynamically parse the Bg Color/Pic column. If the value \nstarts with a URL protocol (http) or data URI (data:), render it as background-image: \nurl(...) with cover styling. Otherwise, treat it as background-color.","Chinese Specification (中文规则对照)":"CSS 编译器必须动态解析 Bg Color/Pic 这一栏。如果文字以网址\n协议（http）或数据流（data:）开头，必须将其渲染为 \nbackground-image: url(...)；否则，一律使用 background-color 作\n为纯色处理。"},{"Module (模块)":"Responsive Breakpoint\n\n(响应式断点切换)","Condition (触发条件)":"Parsing Global style columns","English Specification (英文规则描述)":"The engine must set the global responsive breakpoint at a screen width of 768px. \nFor screens wider than 768px, it must exclusively apply styles from columns \nprefixed with PC. For screens 768px or narrower, it must exclusively apply styles \nfrom columns prefixed with HP.","Chinese Specification (中文规则对照)":"引擎必须将全局响应式断点设定为屏幕宽度 768px。当屏幕宽于 \n768px 时，强制且仅读取带有 PC 前缀的样式列；当屏幕小于或等\n于 768px 时，强制且仅读取带有 HP 前缀的样式列。"},{"Module (模块)":"Responsive Fallback Chain\n\n(响应式降级回退机制)","Condition (触发条件)":"Parsing missing HP values","English Specification (英文规则描述)":"If an HP column value evaluates to \"No Data\", the engine must follow a strict \nfallback chain: 1. Search for the HP value in its parent section. 2. If the parent also \nhas \"No Data\", fallback to the element's own PC column value.","Chinese Specification (中文规则对照)":"当任何 HP 栏位为“无数据”时，引擎必须执行严谨的回退链：1. 优\n先尝试继承其父级 Section 的同名 HP 栏位值；2. 若父级 HP 亦为\n空，则最终降级采用该元素自身的 PC 栏位值。"},{"Module (模块)":"Flex Layout Engine\n(弹性排版引擎)","Condition (触发条件)":"Parsing Alignment columns","English Specification (英文规则描述)":"The engine must use CSS Flexbox. If Alignment contains flex-column, stack items \nvertically. If flex-reverse or right, reverse the visual order of text and media. If \nLayout Position is center, center the elements.","Chinese Specification (中文规则对照)":"引擎必须使用 Flexbox 布局。若 Alignment 包含 flex-column，则\n上下垂直排列；若包含 flex-reverse 或 right，强制将图片与文字\n的左右/上下顺序反转；若 Position 为 center，则居中对齐。"},{"Module (模块)":"Advanced Positioning Engine\n(高级定位引擎)","Condition (触发条件)":"Parsing Layout Position column","English Specification (英文规则描述)":"If the value contains top fixed, the engine must apply position: fixed; top: 0; left: 0; \nwidth: 100%; z-index: 1000; to the element.","Chinese Specification (中文规则对照)":"如果数值包含 top fixed，引擎必须为其生成强制固定在顶部的 \nCSS 代码，并设置最高层级防遮挡。"},{"Module (模块)":"Smart Parent-Child Wrapper\n(智能父子嵌套包装器)","Condition (触发条件)":"Parsing sequential rows with suffix","English Specification (英文规则描述)":"If consecutive rows share a base name (e.g., About Row 1, About Row 2), the \nengine must dynamically wrap them in a master container named after the base \n(About). The master container must strictly apply the base's Global styles \n(e.g., flex-column, background image). The inner rows strictly govern their own \ninternal layout (e.g., flex-row, 70% width).","Chinese Specification (中文规则对照)":"当遇到带有 Row 后缀的连续行时，引擎必须自动生成一个以其前\n缀（如 About）命名的父级大盒子将它们包裹。大盒子强制应用其\n自身的 Global 样式（垂直排布、背景图等），而内部的小盒子独立\n负责自身的长宽与图文左右排布。"},{"Module (模块)":"Alternating Split Layout\n(图文交错)","Condition (触发条件)":"About Row* in Main sheet","English Specification (英文规则描述)":"The engine enforces Layout B: Title and Content must be wrapped into a vertical \ntext-group container first, then aligned horizontally next to the Media.","Chinese Specification (中文规则对照)":"网页必须采用场景B（图文左右排）：Title 和 Content 必须先打\n包进一个垂直的隐形文案盒，整体再与 Media 图片左右并排。"},{"Module (模块)":"Product Gallery Overview\n(产品画廊列表页)","Condition (触发条件)":"Default Picture & Title","English Specification (英文规则描述)":"The main gallery page (products) must only display the Title and Default \nPicture (as thumbnail). It must never load the heavy Media or Content.","Chinese Specification (中文规则对照)":"产品主列表页（画廊区）的每张卡片只能展示 Title 和 Default \nPicture（封面图）。为了极速加载，绝对不能在此页面渲染 \nMedia 和 Content。"},{"Module (模块)":"Dynamic Product Filtering\n(动态产品筛选与联动)","Condition (触发条件)":"Clicking Product Filter Menu Item","English Specification (英文规则描述)":"1. No Reload: Instantly filter Product Filter Content Items on the client-side without \n   page refresh.\n2. Data Matching: Strictly match the menu's identifier with the content's \n    Category / Tag.\n3. Show All: A designated \"All\" (全部) menu must bypass filtering and display all \n    items.\n4. Active State: The clicked menu item must visually reflect an \"active/selected\" \n    styling state to the user.","Chinese Specification (中文规则对照)":"1. 无刷新拦截：在客户端瞬间过滤右侧的产品卡片，绝对禁止页面\n    刷新。\n2. 精准匹配：严格将所点菜单的标识符与产品表中的 \n    Category / Tag 字段进行比对。\n3. 全局展示：遇到特殊的“全部”菜单时，豁免过滤机制，展示所有\n     产品。\n4. 激活状态：被点击的菜单项必须在视觉上切换为“已选中/高亮”\n    状态，以提示用户当前位置。"},{"Module (模块)":"Product Detail Page Assets\n(产品详情页内容)","Condition (触发条件)":"Content & Media in Product sheet","English Specification (英文规则描述)":"The Content and Media columns belong exclusively to the Product ID detail \npop-up. The engine must render them only inside the pop-up modal.","Chinese Specification (中文规则对照)":"Content（详述）和 Media（多媒体）是小分页详情弹\n窗的专属资产。引擎只有在用户点击卡片触发弹窗时，\n才允许把它们渲染在弹窗内部。"},{"Module (模块)":"Product Detail Pop-up\n(详情局部弹窗)","Condition (触发条件)":"Clicking valid product cards","English Specification (英文规则描述)":"Clicking a card with a valid Product ID (excluding \"-\") must trigger a custom \nmodal overlay styled according to the Product ID specs in the Global sheet.","Chinese Specification (中文规则对照)":"当用户点击带有真实 Product ID 的商品卡片时，在当前页直\n接弹出一个局部覆盖的高定详情弹窗，其样式完全套用 Global \n中 Product ID 的设定。"},{"Module (模块)":"Carousel State Control\n(智能视频轮播联动)","Condition (触发条件)":"Multimedia slider in pop-up","English Specification (英文规则描述)":"The carousel must pause instantly when a video plays. When the video ends, the \nsystem must wait for 3 seconds before automatically resuming the carousel \nrotation.","Chinese Specification (中文规则对照)":"详情页轮播图如果播放到视频，用户点击播放时轮播必须立刻\n暂停；视频播放结束（On Ended）后，强制等待 3 秒钟，随\n后自动恢复轮播。"},{"Module (模块)":"Form Element Mapping\n(表单元素变身映射)","Condition (触发条件)":"Feedback Form","English Specification (英文规则描述)":"If Button is empty and Media is \"-\" (or empty), render it as a static header text \nblock (\u003ch1> and \u003cp>) at the top of the form. If Media contains an input type \n(e.g., text, email), map it to an HTML \u003cinput> or \u003ctextarea> where Title is the label \nand Content is the placeholder.","Chinese Specification (中文规则对照)":"当遇到名为 Feedback Form 的 Section 时：如果 Button 为空\n且 Media 填的是 \"-\"（或留空），必须将其渲染为表单顶部的静\n态大标题与副标题文本块；如果 Media 填的是具体的输入类型\n（如 text），才将其转化为打字输入框组件。"},{"Module (模块)":"Form Submission\n(表单提交响应)","Condition (触发条件)":"Feedback Form","English Specification (英文规则描述)":"When the Submit button is clicked, the engine must intercept the event, collect all \ninput values, and send a POST request to the Apps Script API. The data must be \nautomatically appended as a new row in a spreadsheet tab named Feedback.","Chinese Specification (中文规则对照)":"当用户点击提交按钮时，前端引擎必须拦截该事件，自动收集所\n有输入框的内容，并通过 POST 请求异步发送给     <script>
        var DB = JSON.parse(document.getElementById('site-data').textContent);
        var WEB_APP_URL = "";

        // 🌟 【问题1修复】支持多维数值解析 (例: "10px 20px" 或 "0.05 0.1")
        function parseUnit(val) {
            if (!val || val === "No Data") return "";
            var parts = val.toString().trim().split(/\s+/); 
            var parsedParts = parts.map(function(s) {
                if (/[a-zA-Z%]$/.test(s)) return s; 
                if (!isNaN(s) && s !== "") {
                    var num = parseFloat(s);
                    if (num > 0 && num <= 1) return (num * 100) + "%"; 
                    if (num === 0) return "0px";
                    return num + "px"; 
                }
                return s;
            });
            return parsedParts.join(" ");
        }

        function parseMediaUrl(url) {
            var svgHolder = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23eee'/><text x='50%' y='50%' font-size='12' font-family='sans-serif' text-anchor='middle' fill='%23aaa' dy='.3em'>No Image</text></svg>";
            if (!url || url === "No Data" || url === "x") return svgHolder;
            if (url.indexOf("drive.google.com") > -1) {
                try { return "https://ieee-ies.org/images/files/technical-committees/tc-hsi/picture.php?id=" + url.split("/d/")[1].split("/")[0]; } catch(e) {
                try { return "https://docs.google.com/uc?export=view&id=" + url.split("id=")[1].split("&")[0]; } catch(err) { return url; } }
            }
            return url;
        }

        function getStyleRule(sectionName) {
            var rule = DB.Global.find(function(r) { return r.Section === sectionName; });
            if (rule) return rule;
            if (sectionName.indexOf(" Row") > -1) {
                var parentName = sectionName.replace(/ Row(\ \d+)?$/, "");
                return DB.Global.find(function(r) { return r.Section === parentName; });
            }
            return null;
        }

        function compileDynamicCSS() {
            var styleTag = document.createElement("style");
            var cssText = "";
            
            DB.Global.forEach(function(row, idx) {
                var className = "dyn-style-" + idx;
                row._compiledClass = className; 
                var isMobile = window.innerWidth <= 768;
                
                var fSize = parseUnit(isMobile ? (row['HP Font Size'] !== "No Data" ? row['HP Font Size'] : row['PC Font Size']) : row['PC Font Size']);
                var width = parseUnit(isMobile ? (row['HP Width'] !== "No Data" ? row['HP Width'] : row['PC Width']) : row['PC Width']);
                var height = parseUnit(isMobile ? (row['HP Height'] !== "No Data" ? row['HP Height'] : row['PC Height']) : row['PC Height']);
                var padding = isMobile ? (row['HP Padding'] !== "No Data" ? row['HP Padding'] : row['PC Padding']) : row['PC Padding'];
                var margin = isMobile ? (row['HP Margin'] !== "No Data" ? row['HP Margin'] : row['PC Margin']) : row['PC Margin'];
                
                cssText += "." + className + " {\n";
                if (fSize) cssText += "  font-size: " + fSize + " !important;\n";
                if (row['Font Weight'] && row['Font Weight'] !== "No Data") cssText += "  font-weight: " + row['Font Weight'] + " !important;\n";
                if (row['Text Color'] && row['Text Color'] !== "No Data") cssText += "  color: " + row['Text Color'] + " !important;\n";
                
                // 🌟 【问题2修复】放宽背景图片正则验证，确保背景正常渲染
                if (row['Bg Color/Pic'] && row['Bg Color/Pic'] !== "No Data") {
                    var bg = row['Bg Color/Pic'].toString().trim();
                    if (bg.indexOf("http") === 0 || bg.indexOf("data:image") === 0 || bg.indexOf("drive.") > -1 || bg.indexOf(".jpg") > -1 || bg.indexOf(".png") > -1) {
                        cssText += "  background-image: url('" + parseMediaUrl(bg) + "') !important;\n";
                        cssText += "  background-size: cover !important;\n";
                        cssText += "  background-position: center !important;\n";
                        cssText += "  background-repeat: no-repeat !important;\n";
                    } else {
                        cssText += "  background-color: " + bg + " !important;\n";
                    }
                }
                
                if (width) cssText += "  width: " + width + " !important;\n";
                if (height) cssText += "  height: " + height + " !important;\n";
                if (padding && padding !== "No Data") cssText += "  padding: " + padding + " !important;\n";
                if (margin && margin !== "No Data") cssText += "  margin: " + margin + " !important;\n";
                if (row['Border Radius'] && row['Border Radius'] !== "No Data") cssText += "  border-radius: " + parseUnit(row['Border Radius']) + " !important;\n";
                
                if (row['Layout Position'] === "top fixed") {
                    cssText += "  position: fixed !important; top: 0 !important; ";
                    cssText += "left: 0 !important; right: 0 !important; z-index: 9999 !important;\n";
                    document.body.style.paddingTop = "70px"; // 动态避让导航栏
                }
                cssText += "}\n";
            });
            styleTag.innerHTML = cssText;
            document.head.appendChild(styleTag);
        }

        function getLayoutClasses(rule) {
            if (!rule) return "flex-container";
            var classes = [rule._compiledClass, "flex-container"];
            var align = (rule['PC Alignment'] || "").toLowerCase();
            var isMobile = window.innerWidth <= 768;
            if (isMobile && rule['HP Alignment'] !== "No Data") align = rule['HP Alignment'].toLowerCase();
            
            if (align.indexOf("flex-column") > -1) classes.push("flex-column");
            else if (align.indexOf("flex-reverse") > -1) classes.push("flex-row-reverse");
            else if (align.indexOf("flex-row-wrap") > -1) classes.push("flex-row-wrap");
            else classes.push("flex-row");
            
            if (align.indexOf("space-between") > -1) classes.push("flex-space-between");
            return classes.join(" ");
        }

        // 🌟 【问题3修复】弹窗逻辑
        function openModal(pid) {
            var pData = DB.Product || DB.Products;
            var details = pData.filter(function(r) { return r['Product ID'] == pid; });
            var html = "";
            details.forEach(function(d) {
                if (d.Title && d.Title !== "No Data" && d.Section === "Product Filter Content Item") html += "<h2 style='margin-bottom:10px; color:#333;'>" + d.Title + "</h2>";
                if(d.Media && d.Media !== "No Data" && d.Media !== "x") {
                    html += '<img src="' + parseMediaUrl(d.Media) + '" style="max-width:100%; border-radius:8px; margin:15px 0;">';
                }
                if (d.Content && d.Content !== "No Data") html += "<p style='color:#666; line-height:1.6; text-align:left; width:100%;'>" + d.Content + "</p>";
            });
            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('product-modal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('product-modal').style.display = 'none'; }

        function renderPage() {
            var hash = window.location.hash.substring(1).toLowerCase() || "main";
            var contentDiv = document.getElementById("page-content");
            contentDiv.innerHTML = "";
            var productData = DB.Product || DB.Products;

            // 1. 产品页面拦截
            if (hash.indexOf("product") > -1 && productData && productData.length > 0) {
                document.title = "产品中心";
                var wrapRules = getStyleRule("Product Filter");
                var html = '<div class="' + getLayoutClasses(wrapRules) + '" style="width:100%; min-height:80vh;">';
                
                var menuRules = getStyleRule("Product Filter Menu");
                var menuHtml = '<div class="' + (menuRules ? menuRules._compiledClass : "") + ' flex-column" style="padding:20px;">';
                var menus = productData.filter(function(r) { return r.Section === "Product Filter Menu Item"; });
                
                menus.forEach(function(m, i) {
                    var activeCls = i === 0 ? "active" : "";
                    var safeTitle = m.Title ? m.Title.toString().replace(/"/g, "&quot;") : "";
                    menuHtml += '<div class="filter-menu-item ' + activeCls + '" ';
                    menuHtml += 'data-title="' + safeTitle + '" ';
                    menuHtml += 'onclick="filterProducts(this, this.getAttribute(\'data-title\'))">';
                    menuHtml += m.Title + '</div>';
                });
                menuHtml += '</div>';
                
                var gridRules = getStyleRule("Product Filter Content");
                var gridHtml = '<div class="' + getLayoutClasses(gridRules) + '" style="flex:1; padding:20px;" id="product-grid">';
                
                productData.filter(function(r) { return r.Section === "Product Filter Content Item"; }).forEach(function(item) {
                    var imgCss = 'width:100%; height:180px; object-fit:cover; border-radius:6px; margin-bottom:10px;';
                    gridHtml += '<div class="product-card flex-column" data-category="' + item['Category / Tag'] + '" onclick="openModal(\'' + item['Product ID'] + '\')">';
                    gridHtml += '  <img src="' + parseMediaUrl(item.Media || item['Default Picture']) + '" style="' + imgCss + '">';
                    gridHtml += '  <h3 style="font-size:18px; margin-bottom:5px;">' + item.Title + '</h3>';
                    gridHtml += '  <p style="color:#666; font-size:14px; flex:1;">点击查看详情</p>';
                    gridHtml += '</div>';
                });
                gridHtml += '</div>';
                
                contentDiv.innerHTML = html + menuHtml + gridHtml + '</div>';
                if(menus.length > 0) filterProducts(document.querySelector('.filter-menu-item'), menus[0].Title);
                return;
            }

            // 2. 联系我们拦截 (🌟 【问题4、5修复】靠左对齐与 Feedback Item 识别)
            if (hash.indexOf("contact") > -1 && DB.Contact && DB.Contact.length > 0) {
                document.title = "联系我们";
                var wrapRules = getStyleRule("Contact Container") || getStyleRule("Contact");
                var css1 = 'width:100%; min-height:100vh; padding:40px 20px; align-items:center;';
                var html = '<div class="' + getLayoutClasses(wrapRules) + ' flex-column" style="' + css1 + '">';
                html += '  <div class="seamless-container" style="max-width:600px;">';
                
                var formHtml = "";
                var isFormOpened = false;
                
                DB.Contact.forEach(function(row) {
                    var rRule = getStyleRule(row.Section);
                    var cls = rRule ? rRule._compiledClass : "generic-card";
                    
                    if (row.Section === "Contact Item") {
                        // 改为靠左且紧凑
                        var cCss = 'padding:10px 0; border-bottom:1px solid #eee; width:100%; justify-content:flex-start; gap:10px; text-align:left; align-items:flex-start;';
                        html += '<div class="' + cls + ' flex-row" style="' + cCss + '">';
                        html += '  <strong style="min-width:90px;">' + row.Title + '</strong><span style="flex:1;">' + row.Content + '</span></div>';
                    }
                    if (row.Section === "Feedback Item" || row.Section === "Feedback") {
                        // 独立标题居中
                        html += '<h2 class="' + cls + '" style="margin-top:30px; margin-bottom:10px; text-align:center; width:100%;">' + row.Title + '</h2>';
                    }
                    if (row.Section === "Feedback Form") {
                        if (!isFormOpened) {
                            var fCss = 'background:white; padding:25px; border-radius:8px; border:1px solid #eee; width:100%; gap:15px; margin-top:15px;';
                            formHtml += '<form onsubmit="handleForm(event)" class="flex-column" style="' + fCss + '">';
                            isFormOpened = true;
                        }
                        if (row.Button && row.Button !== "No Data") {
                            var bCss = 'background:#4285f4; color:white; border:none; padding:12px; border-radius:6px; cursor:pointer; font-weight:bold; margin-top:10px;';
                            formHtml += '<button type="submit" style="' + bCss + '">' + row.Button + '</button>';
                        } else {
                            formHtml += '<div class="flex-column" style="gap:5px; text-align:left;"><label style="font-weight:500;">' + row.Title + '</label>';
                            if(row.Media === "textarea") {
                                var tCss = 'padding:10px; border:1px solid #ccc; border-radius:4px; height:80px; resize:none; width:100%;';
                                formHtml += '<textarea name="' + row.Title + '" placeholder="' + row.Content + '" style="' + tCss + '" required></textarea>';
                            } else {
                                var iCss = 'padding:10px; border:1px solid #ccc; border-radius:4px; width:100%;';
                                formHtml += '<input type="' + (row.Media || "text") + '" name="' + row.Title + '" placeholder="' + row.Content + '" style="' + iCss + '" required>';
                            }
                            formHtml += '</div>';
                        }
                    }
                });
                
                if (isFormOpened) formHtml += '</form>';
                contentDiv.innerHTML = html + "</div>" + formHtml + '</div>';
                return;
            }

            // 3. 通用页面渲染 (🌟 修复 Hero 顶部大图加载)
            var targetKey = Object.keys(DB).find(function(k) { return k.toLowerCase() === hash.toLowerCase(); }) || "Main";
            document.title = targetKey;
            
            var pageRows = DB[targetKey] || DB.Main;
            var wrapRules = getStyleRule(targetKey);
            var mCss = 'width:100%; min-height:90vh; align-items:center;';
            var html = '<div class="' + getLayoutClasses(wrapRules) + ' flex-column" style="' + mCss + '">';
            
            pageRows.forEach(function(row) {
                var rRule = getStyleRule(row.Section);
                var cls = rRule ? rRule._compiledClass : "";
                
                if (row.Section.indexOf("Row") > -1) {
                    var rCss = 'background:white; border:1px solid #eee; border-radius:8px; padding:20px; margin:15px 0; box-shadow:0 2px 8px rgba(0,0,0,0.02); text-align:left;';
                    html += '<div class="' + cls + ' flex-column" style="' + rCss + '">';
                    if (row.Title !== "No Data") html += '<h2>' + row.Title + '</h2>';
                    if (row.Content !== "No Data") html += '<p style="color:#555; margin-top:10px;">' + row.Content + '</p>';
                    if (row.Media && row.Media !== "No Data" && row.Media !== "x") {
                        html += '<img src="' + parseMediaUrl(row.Media) + '" style="max-width:100%; border-radius:4px; margin-top:15px;">';
                    }
                    html += '</div>';
                } else if (row.Section === "Hero") {
                    var hCss = 'width:100%; position:relative; overflow:hidden; min-height:200px; display:flex;';
                    html += '<div class="' + cls + '" style="' + hCss + '">';
                    html += '  <img src="' + parseMediaUrl(row.Media) + '" style="width:100%; height:100%; object-fit:cover;">';
                    html += '</div>';
                } else {
                    html += '<div class="' + cls + '" style="padding:20px; width:100%; text-align:center;">';
                    html += '<h2>' + (row.Title !== "No Data" ? row.Title : "") + '</h2></div>';
                }
            });
            contentDiv.innerHTML = html + '</div>';
        }

        function filterProducts(btn, cat) {
            document.querySelectorAll('.filter-menu-item').forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
            document.querySelectorAll('.product-card').forEach(function(card) {
                if (cat === "全部" || card.getAttribute('data-category') === cat) card.style.display = "flex";
                else card.style.display = "none";
            });
        }

        async function handleForm(e) {
            e.preventDefault();
            var fd = new FormData(e.target);
            var data = Object.fromEntries(fd.entries());
            var btn = e.target.querySelector("button[type='submit']");
            btn.disabled = true; btn.innerText = "发送邮件中...";
            try {
                var res = await fetch(WEB_APP_URL, { method: "POST", body: JSON.stringify(data), headers: { "Content-Type": "text/plain" } });
                var r = await res.json();
                if(r.status === "success") { alert("✅ " + r.message); e.target.reset(); }
                else { alert("❌ 发送失败: " + r.message); }
            } catch(err) { alert("⚠️ 网络问题，提交异常。"); }
            btn.disabled = false; btn.innerText = "重新发送";
        }

        function initNavigation() {
            var navDiv = document.getElementById("navigation-bar");
            var nRules = getStyleRule("Navigation");
            navDiv.className = (nRules ? nRules._compiledClass : "") + " flex-container flex-row";
            navDiv.style.justifyContent = "space-between";
            
            var leftMenu = '<div class="flex-row">';
            var rightMenu = '<div class="flex-row">';
            
            DB.Navigation.forEach(function(row) {
                var rRule = getStyleRule(row.Section);
                var linkCls = rRule ? rRule._compiledClass : "";
                var rawLink = row['Page Link'] || row.html || row.Link || ""; 
                var safeLink = rawLink.toString().toLowerCase();
                var safeTitle = row.Title;
                
                var link = '<a href="#' + safeLink + '" class="' + linkCls + '" style="text-decoration:none; margin: 0 15px;">' + safeTitle + '</a>';
                if (row.Section === "Navigation Item") leftMenu += link;
                if (row.Section === "Navigation Right") rightMenu += link;
            });
            navDiv.innerHTML = leftMenu + "</div>" + rightMenu + "</div>";
        }

        window.addEventListener('hashchange', function() { window.scrollTo(0, 0); renderPage(); });
        window.onload = function() { compileDynamicCSS(); initNavigation(); renderPage(); };
    </script>
</body>
</html>
