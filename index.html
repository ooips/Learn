        // 【新增魔法】智能处理 Google Drive 图片 和 'x' 占位图
        function processMediaUrl(url) {
            if (!url || url === '-' || url.trim() === '') return '';
            // 如果填了 x，给一张默认的灰色空白占位图
            if (url.toLowerCase() === 'x') return 'https://via.placeholder.com/800x400?text=Placeholder+Image';
            
            // 如果是 Google Drive 链接，自动转换为直链
            if (url.includes('drive.google.com')) {
                const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    return 'https://drive.google.com/uc?export=view&id=' + match[1];
                }
            }
            return url;
        }

        function generateDynamicCSS(globalData) {
            let cssString = '';
            globalData.forEach(row => {
                const sheet = (row['Sheet (Tab) / Page'] || '').trim().replace(/\s+/g, '');
                const section = (row['Section'] || '').trim().replace(/\s+/g, '-');
                const subSection = (row['Subsection'] || '').trim().replace(/\s+/g, '-');
                if (!sheet && !section) return;

                let className = '.style-' + sheet;
                if (section && section !== '-') className += '-' + section;
                if (subSection && subSection !== '-' && subSection !== 'Block') className += '-' + subSection;

                cssString += className + ' {\n';
                if (row['Font Size'] && row['Font Size'] !== '-') cssString += '  font-size: ' + row['Font Size'] + 'px;\n';
                if (row['Font Weight'] && row['Font Weight'] !== '-') cssString += '  font-weight: ' + row['Font Weight'] + ';\n';
                if (row['Text Color'] && row['Text Color'] !== '-') cssString += '  color: ' + row['Text Color'] + ';\n';
                
                // 处理背景图
                if (row['Bg Color/Pic'] && row['Bg Color/Pic'] !== '-') {
                    const bg = processMediaUrl(row['Bg Color/Pic'].trim());
                    if (bg.startsWith('http')) {
                        cssString += '  background-image: url(\'' + bg + '\');\n  background-size: cover;\n  background-position: center;\n';
                    } else {
                        cssString += '  background-color: ' + bg + ';\n';
                    }
                }
                
                if (row['Width'] && row['Width'] !== '-') cssString += '  width: ' + row['Width'] + ';\n';
                if (row['Height'] && row['Height'] !== '-') cssString += '  height: ' + row['Height'] + ';\n';
                if (row['Padding'] && row['Padding'] !== '-') cssString += '  padding: ' + row['Padding'] + ';\n';
                if (row['Margin'] && row['Margin'] !== '-') cssString += '  margin: ' + row['Margin'] + ';\n';
                if (row['Border Radius'] && row['Border Radius'] !== '-') cssString += '  border-radius: ' + row['Border Radius'] + ';\n';
                
                if (row['Alignment'] && row['Alignment'] !== '-') {
                    const align = row['Alignment'].toLowerCase();
                    cssString += '  display: flex;\n';
                    if (align.includes('column')) cssString += '  flex-direction: column;\n';
                    if (align.includes('row')) cssString += '  flex-direction: row;\n';
                    if (align.includes('wrap')) cssString += '  flex-wrap: wrap;\n';
                    if (align.includes('reverse')) cssString += '  flex-direction: row-reverse;\n';
                    if (align.includes('space-between')) cssString += '  justify-content: space-between; align-items: center;\n';
                }
                if (row['Layout Position'] && row['Layout Position'] !== '-') {
                    const pos = row['Layout Position'].toLowerCase();
                    if (pos.includes('fixed')) {
                        cssString += '  position: fixed;\n  top: 0;\n  z-index: 999;\n';
                    } else if (pos === 'right') {
                        cssString += '  margin-left: auto;\n'; 
                    }
                }
                cssString += '}\n\n';
            });
            document.getElementById('dynamic-global-styles').innerHTML = cssString;
        }

        function renderNavigation(navData) {
            const container = document.getElementById('nav-container');
            const navClass = 'style-Navigation-Navigation'; 
            let html = '<div class="' + navClass + '" style="width: 100%; display: flex; justify-content: space-between;">';
            let leftItems = [];
            let rightItems = [];

            navData.forEach(item => {
                const section = (item['Section'] || '').trim();
                const btnHtml = '<div style="cursor:pointer; margin: 0 15px;" onclick="switchPage(\'' + item['html'] + '\')">' + item['Title'] + '</div>';
                if (section === 'Navigation Right') {
                    rightItems.push(btnHtml);
                } else {
                    leftItems.push(btnHtml);
                }
            });
            html += '<div style="display:flex; align-items: center;">' + leftItems.join('') + '</div>';
            html += '<div style="display:flex; align-items: center;">' + rightItems.join('') + '</div></div>';
            document.getElementById('page-content').style.paddingTop = '65px'; 
            container.innerHTML = html;
        }

        function renderMain(mainData) {
            let html = '';
            mainData.forEach(row => {
                const section = (row['Section'] || '').trim().replace(/\s+/g, '-');
                if (!section) return;
                const blockClass = 'style-Main style-Main-' + section;
                const titleClass = 'style-Main-' + section + '-Title';
                const contentClass = 'style-Main-' + section + '-Content';

                html += '<div class="' + blockClass + '">';
                if (row['Title'] && row['Title'] !== '-') html += '<h1 class="' + titleClass + '">' + row['Title'] + '</h1>';
                if (row['Content'] && row['Content'] !== '-') html += '<p class="' + contentClass + '">' + row['Content'] + '</p>';
                
                // 【新增】为主页渲染图片/视频/占位图
                let mediaRaw = row['Media'] || row['Picture/Video'] || row['Picture'];
                if (mediaRaw && mediaRaw !== '-') {
                    let mediaUrl = processMediaUrl(mediaRaw);
                    if (mediaUrl) {
                        html += '<img src="' + mediaUrl + '" style="max-width: 100%; height: auto; border-radius: 8px; margin-top: 15px;" />';
                    }
                }
                
                html += '</div>';
            });
            document.getElementById('page-content').innerHTML = html;
        }

        function renderProduct(productData) {
            let menuHtml = '';
            let galleryHtml = '';
            productData.forEach(row => {
                const section = (row['Section'] || '').trim().replace(/\s+/g, '-');
                if (section.includes('Menu')) {
                    const blockClass = 'style-Product-' + section;
                    const titleClass = 'style-Product-' + section + '-Title';
                    menuHtml += '<div class="' + blockClass + '" style="cursor:pointer; padding: 15px; border-bottom: 1px solid #ccc;" onclick="filterProducts(\'' + row['Title'] + '\')"><span class="' + titleClass + '">' + row['Title'] + '</span></div>';
                } else if (section.includes('Content')) {
                    const blockClass = 'style-Product-' + section;
                    const titleClass = 'style-Product-' + section + '-Title';
                    const category = (row['Category / Tag'] || '').trim();
                    galleryHtml += '<div class="' + blockClass + ' product-card" data-category="' + category + '" style="margin: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);"><h3 class="' + titleClass + '">' + row['Title'] + '</h3><p>' + row['Content'] + '</p><small style="color: gray;">[标签: ' + category + ']</small></div>';
                }
            });
            document.getElementById('page-content').innerHTML = '<div class="style-Product-Product-Filter" style="display:flex; width: 100%; min-height: 100vh;"><div style="width: 30%; background: #b6d7a8;">' + menuHtml + '</div><div style="width: 70%; display: flex; flex-wrap: wrap; align-content: flex-start; padding: 20px;">' + galleryHtml + '</div></div>';
        }

        window.filterProducts = function(filterWord) {
            const cards = document.querySelectorAll('.product-card');
            cards.forEach(card => {
                const tag = card.getAttribute('data-category');
                if (filterWord === '全部' || tag === filterWord) {
                    card.style.display = 'flex'; 
                } else {
                    card.style.display = 'none';
                }
            });
        };

        // 【重要修改】使用 Hash 路由彻底解决刷新跳回主页的问题
        window.switchPage = function(pageHtmlName) {
            window.location.hash = pageHtmlName;
        };

        window.addEventListener('hashchange', function() {
            let page = window.location.hash.replace('#', '') || 'index.html';
            if (page === 'index.html') renderMain(APP_DATA.main);
            else if (page === 'products.html') renderProduct(APP_DATA.product);
            else if (page === 'contact.html') renderMain(APP_DATA.contact); 
            window.scrollTo(0, 0);
        });

        // 启动引擎
        generateDynamicCSS(APP_DATA.global);
        renderNavigation(APP_DATA.navigation);
        
        // 触发初始路由（识别用户当前到底是在刷新哪个页面）
        if (!window.location.hash) {
            window.location.hash = 'index.html';
        } else {
            window.dispatchEvent(new Event('hashchange'));
        }

    </script>
